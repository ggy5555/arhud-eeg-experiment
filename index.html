<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="모니터 기반 AR-HUD 배치 연구를 위한 참가자 과제 및 EEG 동기화 기록 도구">
  <title>AR-HUD × EEG 실험 실행기</title>
  <link rel="stylesheet" href="styles.css?v=20260915-web5">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="처음 화면으로">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>AR-HUD × EEG</strong><small>MONITOR SIMULATION</small></span>
      </a>
      <div class="run-status" aria-live="polite">
        <span id="statusDot" class="status-dot idle"></span>
        <span id="statusText">준비 전</span>
      </div>
    </header>

    <div id="progressWrap" class="progress-wrap" hidden>
      <div class="progress-meta"><span id="progressLabel">준비</span><span id="progressValue">0%</span></div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <main id="app" class="content" tabindex="-1"></main>
    <footer class="footer">
      <span>실험 자료는 서버로 전송되지 않습니다.</span>
      <span id="versionLabel"></span>
    </footer>
  </div>

  <section id="experimentLayer" class="experiment-layer" hidden aria-label="참가자 자극 화면">
    <canvas id="stimulusCanvas"></canvas>
    <div id="experimentMessage" class="experiment-message" aria-live="polite"></div>
    <div id="experimentBadge" class="experiment-badge"></div>
  </section>

  <section id="pauseLayer" class="pause-layer" hidden>
    <div class="pause-card">
      <span class="eyebrow">실험 일시정지</span>
      <h2>전체화면이 해제되었거나 일시정지가 요청되었습니다.</h2>
      <p>현재 상태는 기록되었습니다. 참가자와 EEG recording을 확인한 뒤 계속하세요.</p>
      <div class="button-row">
        <button id="resumeButton" class="button primary" type="button">전체화면으로 계속</button>
        <button id="partialButton" class="button secondary" type="button">부분 자료 내보내기</button>
        <button id="stopButton" class="button danger" type="button">실험 중단</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=20260915-web5"></script>
</body>
</html>
